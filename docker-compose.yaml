version: '3.5'
services:
  db_prod:
    image: mariadb:10.11.19@sha256:7d829180b5b2a9ba74f6242876ab401a0d7dd338a807e522ef92bc9698760f20
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: pw
    command: --log-bin --binlog-format=ROW  --server-id=1
    ports:
      - "3308:3306"
    volumes:
      - ./db_prod:/var/lib/mysql

  db_backup:
    image: mariadb:10.11.19@sha256:7d829180b5b2a9ba74f6242876ab401a0d7dd338a807e522ef92bc9698760f20
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: pw
    command: --log-bin --binlog-format=ROW --server-id=3
    ports:
      - "3009:3306"
    volumes:
      - ./db_backup:/var/lib/mysql

  db_test:
    image: mariadb:10.11.19@sha256:7d829180b5b2a9ba74f6242876ab401a0d7dd338a807e522ef92bc9698760f20
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: test
    command: --log-bin --binlog-format=ROW --server-id=3
    ports:
      - "3306:3306"
    volumes:
      - ./db_test:/var/lib/mysql

  db_streaming:
    image: mariadb:10.11.19@sha256:7d829180b5b2a9ba74f6242876ab401a0d7dd338a807e522ef92bc9698760f20
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: streaming
    command: --log-bin --binlog-format=ROW --server-id=3
    ports:
      - "3307:3306"
    volumes:
      - ./db_streaming:/var/lib/mysql
