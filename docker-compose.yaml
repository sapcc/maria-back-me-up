version: '3.5'
services:
  db_prod:
    image: mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: pw
    command: --log-bin --binlog-format=ROW  --server-id=1
    ports:
      - "3308:3306"
    volumes:
      - ./db_prod:/var/lib/mysql

  db_backup:
    image: mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: pw
    command: --log-bin --binlog-format=ROW --server-id=3
    ports:
      - "3009:3306"
    volumes:
      - ./db_backup:/var/lib/mysql

  db_test:
    image: mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: test
    command: --log-bin --binlog-format=ROW --server-id=3
    ports:
      - "3306:3306"
    volumes:
      - ./db_test:/var/lib/mysql

  db_streaming:
    image: mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: streaming
    command: --log-bin --binlog-format=ROW --server-id=3
    ports:
      - "3307:3306"
    volumes:
      - ./db_streaming:/var/lib/mysql
